<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>signal — hoeksemaa.github.io</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23141414'/%3E%3Ccircle cx='8' cy='8' r='4' fill='%23FF6200'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Tokens lifted from assets/css/style.css so this reads as the same site.
   Deliberately NOT @import-ing the live sheet: .content{max-width:50vw}
   would cripple a data table. */
:root{
  --bg:#141414; --panel:#1A1A1A; --panel2:#1E1E1E; --rail:#0D0D0D; --border:#2A2A2A;
  --fg:#F0F0F0; --muted:#666; --dim:#999;
  --orange:#FF6200; --orange2:#E55A00; --cyan:#00D4FF; --green:#00FF88; --red:#FF4444;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{background:var(--bg);color:var(--fg);font-family:'Geist Mono','Courier New',monospace;font-size:14px;line-height:1.4}
body{min-height:100vh;background:var(--bg)}
a{color:var(--orange);text-decoration:none}
a:hover{text-decoration:underline}

/* ── rail ─────────────────────────────────────────────── */
.rail{position:fixed;top:0;left:0;height:100vh;width:72px;background:var(--rail);
  border-right:1px solid var(--border);display:flex;flex-direction:column;padding-top:12px;z-index:100}
.rail-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;
  min-height:66px;color:var(--muted);cursor:pointer;border-left:3px solid transparent;
  font-size:9px;letter-spacing:.08em;font-weight:500;transition:color 80ms;background:none;border-top:0;border-right:0;border-bottom:0;font-family:inherit}
.rail-item:hover{color:var(--fg)}
.rail-item.active{color:var(--orange);border-left-color:var(--orange)}
.rail-item svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ── shell ────────────────────────────────────────────── */
.main{margin-left:72px;padding:12px 16px 40px;max-width:1700px}
/* On a phone the rail becomes a top tab bar. Collapsing it to width:0 made
   WATCH, PEOPLE and HEALTH unreachable, because the buttons live only here. */
@media(max-width:640px){
  .rail{position:static;width:100%;height:auto;flex-direction:row;border-right:none;
    border-bottom:1px solid var(--border);padding-top:0}
  .rail-item{flex:1;min-height:46px;border-left:none;border-bottom:3px solid transparent}
  .rail-item.active{border-left-color:transparent;border-bottom-color:var(--orange)}
  .rail-item svg{width:18px;height:18px}
  .main{margin-left:0;padding:8px}
  .mapwrap{grid-template-columns:1fr}
}

.topbar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:10px}
.brand{color:var(--orange);font-weight:700;font-size:16px;letter-spacing:.06em}
.health{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);letter-spacing:.05em}
.dot{width:7px;height:7px;border-radius:50%;background:var(--muted);flex-shrink:0}
.dot.ok{background:var(--green);box-shadow:0 0 6px var(--green)}
.dot.warn{background:var(--orange)}
.dot.bad{background:var(--red)}
.spacer{flex:1}

.stats{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.stat{background:var(--panel);border:1px solid var(--border);border-radius:2px;padding:8px 14px;min-width:110px}
.stat-n{font-size:22px;font-weight:700;color:var(--fg);line-height:1.1}
.stat-l{font-size:10px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase;margin-top:3px}
.stat.accent .stat-n{color:var(--orange)}

/* ── upper third: map + places ────────────────────────── */
.mapwrap{display:grid;grid-template-columns:1fr 250px;gap:8px;margin-bottom:8px}
@media(max-width:900px){.mapwrap{grid-template-columns:1fr}}
.mapbox{position:relative;background:var(--panel);border:1px solid var(--border);border-radius:2px;overflow:hidden;height:32vh;min-height:240px}
#map{display:block;width:100%;height:100%;cursor:grab}
#map.drag{cursor:grabbing}
.mapctl{position:absolute;top:8px;left:8px;display:flex;gap:4px;z-index:5}
.mapinfo{position:absolute;bottom:6px;left:8px;font-size:10px;color:var(--muted);letter-spacing:.04em;pointer-events:none;text-shadow:0 0 4px #000}
.zoombtn{position:absolute;right:8px;display:flex;flex-direction:column;gap:4px;z-index:5;top:8px}
.tip{position:absolute;pointer-events:none;background:#0A0A0A;border:1px solid var(--orange);border-radius:2px;
  padding:6px 9px;font-size:11px;white-space:nowrap;z-index:20;display:none;line-height:1.5}
.places{background:var(--panel);border:1px solid var(--border);border-radius:2px;overflow-y:auto;height:32vh;min-height:240px}
.places h3{font-size:10px;color:var(--muted);letter-spacing:.1em;padding:8px 10px 6px;font-weight:500}
.prow{display:flex;justify-content:space-between;gap:8px;padding:5px 10px;cursor:pointer;font-size:12px;border-left:2px solid transparent}
.prow:hover{background:var(--panel2);border-left-color:var(--orange)}
.prow.sel{border-left-color:var(--orange);background:var(--panel2)}
.prow b{color:var(--orange);font-weight:500}

/* ── time control ─────────────────────────────────────── */
.timebar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.btn{background:var(--panel);border:1px solid var(--border);color:var(--dim);border-radius:2px;
  padding:5px 11px;font-family:inherit;font-size:11px;letter-spacing:.06em;cursor:pointer;transition:all 80ms}
.btn:hover{border-color:var(--orange);color:var(--fg)}
.btn.on{background:var(--orange);border-color:var(--orange);color:#141414;font-weight:700}
.btn.sm{padding:3px 7px;font-size:10px}
#hist{flex:1;min-width:200px;height:40px;background:var(--panel);border:1px solid var(--border);border-radius:2px;cursor:crosshair;display:block}

/* ── filters ──────────────────────────────────────────── */
.filters{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:8px}
.filters input,.filters select{background:var(--panel);border:1px solid var(--border);color:var(--fg);
  border-radius:2px;padding:5px 8px;font-family:inherit;font-size:12px}
.filters input:focus,.filters select:focus{outline:1px solid var(--orange);border-color:var(--orange)}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--panel2);border:1px solid var(--orange);
  color:var(--orange);border-radius:2px;padding:3px 8px;font-size:11px}
.chip span{cursor:pointer;font-weight:700}

/* ── table ────────────────────────────────────────────── */
.tbl{width:100%;border-collapse:collapse;font-size:12px}
.tbl th{text-align:left;color:var(--muted);font-size:10px;letter-spacing:.08em;text-transform:uppercase;
  font-weight:500;padding:7px 8px;border-bottom:1px solid var(--border);white-space:nowrap;position:sticky;top:0;background:var(--bg);z-index:2}
.tbl th.s{cursor:pointer}
.tbl th.s:hover{color:var(--fg)}
.tbl th.act{color:var(--orange)}
.tbl td{padding:6px 8px;border-bottom:1px solid #1F1F1F;vertical-align:top}
.tbl tr:hover td{background:var(--panel)}
.cell{cursor:pointer}
.cell:hover{color:var(--orange);text-decoration:underline}
.mono{color:var(--dim)}
.tag{display:inline-block;padding:1px 5px;border-radius:2px;font-size:10px;letter-spacing:.05em;border:1px solid}
.tag.bot{color:var(--muted);border-color:#333}
.tag.self{color:var(--cyan);border-color:var(--cyan)}
.tag.net{color:var(--orange);border-color:#4a2a10;background:#2a1708}
.tag.ev{color:var(--cyan);border-color:#14384a}
.tag.done{color:var(--green);border-color:#144A2A}
.vchip{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.empty{padding:40px 12px;text-align:center;color:var(--muted)}
.empty b{color:var(--orange);display:block;margin-bottom:8px;font-size:16px}
.view{display:none}
.view.on{display:block}
.panel{background:var(--panel);border:1px solid var(--border);border-radius:2px;padding:12px;margin-bottom:8px}
.panel h2{font-size:13px;color:var(--fg);letter-spacing:.06em;margin-bottom:8px;font-weight:700}
.note{font-size:11px;color:var(--muted);line-height:1.6}
.bar{height:4px;background:#2A2A2A;border-radius:2px;overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--orange)}

/* drill-down */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:200;display:none;align-items:center;justify-content:center;padding:20px}
.sheet.on{display:flex}
.sheet-in{background:var(--panel);border:1px solid var(--orange);border-radius:2px;max-width:900px;width:100%;
  max-height:84vh;overflow-y:auto;padding:16px}
.x{float:right;cursor:pointer;color:var(--muted);font-size:18px;line-height:1}
.x:hover{color:var(--orange)}
</style>
</head>
<body>
<nav class="rail">
  <button class="rail-item active" data-view="feed">
    <svg viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h12"/></svg>FEED</button>
  <button class="rail-item" data-view="watch">
    <svg viewBox="0 0 24 24"><path d="M23 7l-7 5 7 5V7z"/><rect x="1" y="5" width="15" height="14" rx="2"/></svg>WATCH</button>
  <button class="rail-item" data-view="people">
    <svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/></svg>PEOPLE</button>
  <button class="rail-item" data-view="health">
    <svg viewBox="0 0 24 24"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>HEALTH</button>
</nav>

<main class="main">
  <div class="topbar">
    <div class="brand">SIGNAL</div>
    <div class="health"><span class="dot" id="hdot"></span><span id="hage">checking…</span></div>
    <div class="health"><span class="dot ok" id="ldot"></span><span id="live">—</span></div>
    <div class="spacer"></div>
    <button class="btn sm" id="autobtn">AUTO 60s</button>
    <button class="btn sm" id="refresh">REFRESH</button>
  </div>

  <div class="stats" id="stats"></div>

  <div class="mapwrap">
    <div class="mapbox">
      <canvas id="map"></canvas>
      <div class="mapctl"><button class="btn sm" id="fit">FIT</button></div>
      <div class="zoombtn"><button class="btn sm" id="zin">+</button><button class="btn sm" id="zout">−</button></div>
      <div class="mapinfo" id="mapinfo"></div>
      <div class="tip" id="tip"></div>
    </div>
    <div class="places">
      <h3>TOP PLACES</h3>
      <div id="plist"></div>
    </div>
  </div>

  <div class="timebar">
    <button class="btn" data-span="1">24H</button>
    <button class="btn on" data-span="7">7D</button>
    <button class="btn" data-span="30">30D</button>
    <button class="btn" data-span="90">90D</button>
    <button class="btn" data-span="0">ALL</button>
    <canvas id="hist"></canvas>
    <button class="btn sm" id="clearbrush" style="display:none">CLEAR RANGE</button>
  </div>

  <div class="filters">
    <input id="q" placeholder="search path, city, ISP, IP…" style="min-width:190px">
    <select id="fpath"><option value="">all endpoints</option></select>
    <select id="fplace"><option value="">all locations</option></select>
    <button class="btn" id="tbots">BOTS: HIDDEN</button>
    <button class="btn" id="tself">MINE: HIDDEN</button>
    <div id="chips"></div>
  </div>

  <section class="view on" id="v-feed"><div id="tblwrap"></div></section>
  <section class="view" id="v-watch"><div id="watchwrap"></div></section>
  <section class="view" id="v-people"><div id="peoplewrap"></div></section>
  <section class="view" id="v-health"><div id="healthwrap"></div></section>
</main>

<div class="sheet" id="sheet"><div class="sheet-in"><span class="x" id="sx">✕</span><div id="sheetbody"></div></div></div>
<script>window.__DASH__="__DASHPATH__";window.__WORLD__=__WORLDDATA__;</script>
<script>
__APPJS__
</script>
</body>
</html>
